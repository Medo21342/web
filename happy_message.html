<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Messages 💌</title>
<style>
    body {
        background: #0b0b0b;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        outline: none;           /* يشيل الإطار الأزرق */
        box-shadow: none;        /* يشيل أي ظل إضافي */
        -webkit-tap-highlight-color: transparent; /* يشيل الـ highlight على الموبايل والضغط */
}

    * { direction: rtl; }

    .container {
        background: #1a1a1a;
        padding: 25px; /* مسافة ثابتة من الحواف */
        padding-top: 40px; /* مسافة علوية ثابتة عشان الحافة من فوق متتحركش */
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(255,77,109,0.2);
        text-align: center;
        width: 90%;
        max-width: 360px;
        /* شيلنا الـ min-height خالص عشان يصغر ويكبر براحته */
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* يبدأ من فوق دايماً */
        align-items: center;
        transition: all 0.4s ease-in-out; /* أنيميشن ناعم لما الحجم يتغير */
    }

    #contentArea {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 10px; /* مسافة بسيطة تحت العنوان */
    }

    h1 { color: #ff5fa2; margin-bottom: 20px; font-size: 22px; }

    .message-text {
        color: #ff8fa3;
        font-size: 17px;
        line-height: 1.8;
        white-space: pre-wrap;
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
    }

    .button {
        display: block;
        width: 100%;
        padding: 12px 0;
        margin: 10px 0;
        border: none;
        border-radius: 15px;
        background: linear-gradient(90deg, #ff5fa2, #ff8fa3);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        outline: none;
        -webkit-tap-highlight-color: transparent;
    }

    .button:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(255,77,109,0.4); }
    
    .back-btn { background: rgba(255, 255, 255, 0.1); color: #ff8fa3; border: 1px solid #ff5fa2; }

    #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(11, 11, 11, 0.98); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        cursor: pointer;
    }

    .start-btn {
        padding: 15px 30px; font-size: 20px; background: #ff5fa2;
        color: white; border-radius: 50px; animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
.message-box{
    width:90%;
    max-width:470px;
    height:270px;
    margin:40px;
    padding:25px;
    border-radius:25px;

    background: rgba(255,95,162,0.08);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,95,162,0.3);

    box-shadow:
    0 0 25px rgba(255,95,162,0.25),
    inset 0 0 15px rgba(255,95,162,0.15);

    overflow:hidden;
    position:relative;
    animation:fadeIn 1s ease;
}

.message-content{
    height:100%;
    overflow-y:auto;
    padding-right:10px;
    line-height:1.9;
    font-size:16px;
    color:white;
    text-align:center;
    scroll-behavior: smooth;
}
/* شكل السكرول */
.message-content::-webkit-scrollbar{
    width:6px;
}
.message-content::-webkit-scrollbar-thumb{
    background:#ff5fa2;
    border-radius:10px;
}

/* أنيميشن دخول */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}
    
    .heart-touch{
position:fixed;
pointer-events:none;
animation:heartFloat 1.2s ease forwards;
z-index:10000;
will-change: transform, opacity;
}

@keyframes heartFloat{
0%{
transform:scale(.2) translateY(0) rotate(0deg);
opacity:0;
}
20%{
opacity:1;
}
60%{
transform:scale(1.2) translateY(-25px) rotate(15deg);
}
100%{
transform:scale(.8) translateY(-70px) rotate(-15deg);
opacity:0;
}
}
    
    /* منع التحديد */
*{
user-select:none;
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
}

/* منع لون التحديد */
::selection{
background:transparent;
}
</style>
</head>
<body>
<div id="overlay" onclick="closeOverlay()">
    <div class="start-btn">دوسي هنا يا بسبوستي 💗</div>

</div>

<div class="container">
    <h1 id="mainTitle"></h1>
<div id="contentArea">
    <div class="message-box">
        <div class="message-content"></div>
    </div>
</div>
    
    <button id="mainExitBtn" style="width: 100%;" class="button back-btn" onclick="location.href='main.html'">العوده للصفحه الرئيسيه 🏠</button>
</div>

 const messages = {
        msg1: {

            text: `بصي يا بسبوستي انهارده طبعاً مش يوم عادي خالص اللي هو 27/2 لان انهارده اليوم بتاعنا ومش بس النهارده .... كل يوم هيفضل يومنا كل يوم هيفضل عيد مبينا عشان وجودك جنبي بيخلي كل يوم حلو ....كفايه بس وجودك لوحدو ده انا ممكن احتفل بيه كل يوم بس انهارده بالذات ده اكتر يوم مميز في حياتي واكتر يوم بحبو لانو اليوم اللي عرفت فيه احلى واجمل انسانه في حياتي واول واخر حب ليا وهي انتي يا بسبوستي ....وبكدا يا حبيبتي نكون انا وانتي بقالنا 3 سنين سوا .... 3 سنين وانتي منوره حياتي يا بسبوستي ومخلياني اسعد انسان في الدنيا بوجودك معايا .... 3 سنين وانا كل يوم بحمد ربنا على النعمه اللي رزقني بيها اللي هي انتي 1095 يوم عشناهم سوا وكل يوم بكتشف وبتأكد انك اعظم واحسن اختيار اختارتو في حياتي والاختيار الوحيد اللي عمري ما ندمت عليه وكل يوم بيعدي حبي ليكي بيزيد اكتر وغلاوتك عندي بتكبر ....كل ثانيه عشناها سوا كانت حلوه كل ثانيه جمعتنا كانت درس وفرحه وذكريات كل لحظه بشوفك فيها بتأكد إنك مش بس حبيبتي انتي جزء من قلبي وروحي واكتر كمان انتي حياتي كلها يا بسبوستي ....3سنين واحنا مع بعض عدو بسرعه اوي يا حبيبتي بحلوهم ومرهم بكل تفاصيلهم وعملنا فيهم احسن ذكريات سوا عمرها ما هتتنسي ابداً .... وهما مش مجرد 3 سنين وخلاص ده بالنسبالي عمر جديد ابتدى ب معرفتي بيكي حياه جديده اتكتبتلي عنوانها انتي يا بسبوستي .... 3 سنين عيشناهم سوا ب فرح وحب وضحك وهزار وخناقتنا التافهه اللي بتخلص بكلمة بحبك واي نعم احنا اتخانقنا كتير وحصل بينا مشاكل كتير وسبنا بعض كذا مره بس  بس حتى الزعل معاكي ليه طعم تاني لانه بيرجعنا ديما اقرب ويخليني اقدر كل حاجه فيكي اكتر واكتر  .... بس المهم ان كل مره بتحصل بينا حاجه بنرجع ل بعض واحسن من الاول كمان لاننا ملناش غير بعض اصلا انا وانتي مكتوبين ل بعض يا بسبوستي خلاص "بسمله ل ميدو وميدو ل بسمله" بس كدا  .... وكل مره بنرجع لبعض وكل مره بشوفك او بلمسك بحس الدنيا فيها معنى بحس إن وجودك جنبي هو اهم حاجه حصلتلي في حياتي 😻💋\n \nبصراحه ساعات بحس إن الكلام مش كفايه يوصف اللي جوا قلبي بس هحاول يعني 😔 وجودك جنبي مش بس بيفرحني ده امان وراحه وجودك معايا محلي حياتي ومديها طعم كدا وكلمه حلوه منك كفيله تهون عليا حجات كتيره اوييي اه والله زي ما بقولك كدا لما بنبقا متخانقين او زعلانين حتى لو على حاجه تافهه والاقي منك كلمه حلوه او اهتمام بسيط او او بفرح فرحه مش هتصدقيها بجد كلامنا لوحدو اصلا بيهون عليا كل حاجه لو قولنا كلمتين حلوين بليل ولا اكلمنا كول وسمعت صوتك وضحكتك بفرح موووت وعيوني بطلع فراشات كدا حتى لو لاحظتي انا طول منا بكلمك بضحك حتى لو زعلانين بيبقا تاني احلى شعور في الدنيا بعد ما اشوفك سواء صدفه في شارع او لما بتتصوري او لو نزلنا ديت ودي حاجه مش بتحصل اصلا يعتبر (هتحصل يا روح امك هي الله اعلم حصلت ولا لأ بس في الوقت اللي بكتب فيه دلوقتي محصلتش ولو محصلتش لحد الوقت ده ف اعرفي اني زعلان منك جداً جداً 😔💔) المهم .... اهه لما بشوفك ده بجد احلى شعور في الدنيا بحس بفراشات بتدخل جوايا كدا وعيوني بطلع قلوب وببقا جوايا كمية فرححح كبيره جداً هو انا اه بشوفك كتير لما بتتصوري او صدفه مع إن الصدفه محصلتش من زمان بس طعم اني اشوفك وش ل وش كدا واسمع صوتك في الحقيقه واشوفك كدا وابصلك بقا وامسك ايدك لمسة ايدك دي حاجه تانيه خالص يا بسمله ليها طعم وليها شعور تاني غير اي حاجه في الدنيا بتبقا تحفهههه مووووووت وقتها مش ببقا عايز حاجه تانيه من الدنيا بجد ولما ببص في عيونك يالهوييي بدووب وقتها يا بسمله بحس اني بسيح كداا .... عامةً عيونك دي احلى حاجه شافتها عنيا السواد بتاعها والبني اللي فيها وواسعنها ورموشك ورسمة عينك شبه الغزلان جداً بجد بغرق في جمال بحر عيونك 😍... وعامةً مش بس عيونك انتي كلك تحفهههه ملامحك الهاديه الكيووت دييي وبياضك اللي مخليكي منوره حرفياً (منوره حياتي وبتنوري في الضلمه حرفياً ما شاء الله يعني) وشفايفك الورديه اللي عايزه تتاكل اكل 🫦 ومناخيرك الصغننه خالص دي وشعرك بقا وجمال شعرك من ناحية اللون والطول ونعموة الخصله والتموج بتاعها لا لا في حته تانيهه دههه العشق دهه بسم الله ما شاء الله عليكي يعني قمرر بجدد (وطبعاً يعني جسمك الموووت ده بحبو مووت بس مش هكلم عنو هنا لينا شات تاني يجمعنا يا فرس انتي 🫦)... عامةً كل حاجه فيكي حلوه وتتحب من ناحية الشكل والصفات والاخلاق والاحترام كل حاجه فيكي بجد تتحب ده كفايه بس حنيتك عليا وكلامك السكر ده ونكشك ليا لما بنزعل مثلا او عامةً اي نعم فيكي حجات بضايقني بس لو جينا على المجمل ف انتي مفكيش غلطه وعيوبك ان وجدت مميزات برضو وراضي بيكي كدا وحابك زي ما انتي كدا  (بس ده مينكرش اني هغير فيكي حجات برضو يا روح امك وان فيكي حجات بضايقني 🤨) عامةً انتي بالنسبالي احلى واحسن بنت في العالم كلو انتي مش بس بنت كمان انتي ست البنات كلها يا بسبوستي واجمل واحده فيهم كلهم وعمري ما هبص ل حد ولا حد هيملى عيني وحياتي زي ما انتي ملتيهم يا بسبوستي ولا عمر حد هياخد مكانك في قلبي وفي حياتي 😍💗

 مش عارف اقول ايه بس انا محظوظ بيكي جداً يا بسبوستي واتمنى تفضلي علطول معايا وفي حياتي ومتبعديش عني تاني خالص يا بسمله لاني حرفياً يعني من غيرك حياتي بتقف وبجد يا بسبوستي مهما كتبت ومهما حاولت اقول مش هيوفيكي حقك بس كل كلمه من قلبي وكل رسالة وكل ضحكه ودمعه وكل حاجه بينا هي شهاده على حبي ليكي على تقديري ليكي على إنك احلى حاجه في حياتي وبوعدك هفضل احبك ل اخر نفس ربنا كتبهولي وهفضل مختارك شريكه ليا في حياتي وهفضل معاكي في كل لحظه واخليكي تحسي ديماً إنك اهم حد في حياتي… وفعلا دي حقيقيه حقيقه جدًا انتي اهم شخص في حياتي 💗💫\n\nكل سنة وانتي معايا .... كل سنه وانتي اقرب حد ل قلبي .... كل سنه واحنا سوا وعمر ما حاجه هتفرقنا ....كل سنه وانا سندك وفي ضهرك علطول ....كل سنه وانتي جمبي وقرفاني ومطلعه عيني كدا بس على قلبي زي العسل والله .... وكل سنه واحنا بنكتب حكايتنا بطريقتنا حكاية حب مش بتخلص ولا هتخلص غير بموتنا سوا\n\nعايزك بقا تعرفي اني بحبك وبحبك جداً جداً كمان... بحبك بعدد كل ثانية عدت بينا .... بعدد كل ضحكه ضحكناها من قلبنا .... بعدد كل مره حسّيت فيها بالفرح وانت جنبي .... بحبك بطريقه يا بسمله انا مش عارفاعبر عنها ومشل لاقي كلام يعبر عنها بس انا بحبك مووت يا بنت قلبي 🥹💗\n\n3 سنين مليانين حب ....واجمل 3 سنين في حياتي كلها عشان انتي فيهم يا بسبوستي 😻💗`
        },
        msg2: {
            title: "💋 دي بقا هابي مسج جديده اقري واتبسطي 💋",
            text: `قبل ما اكتب اي كلمه بس حابب اقول ان اليوم ده بالنسبه ليا مش مجرد تاريخ ده اليوم اللي اتغيرت فيه حياتي كلها اليوم اللي دخلتي فيه حياتي وبقي ليها معني مختلف خالص من اللحظه دي وانا حاسس ان ربنا رزقني باجمل حاجه ممكن الانسان يتمناها رزقني بيكي انتي💗\n\nعدى علينا 3 سنين سوا 3 سنين يمكن في ناس تشوفهم وقت عادي لكن بالنسبه ليا دول اجمل ايام عشتهم في حياتي كلها ايام مليانه ضحك كلام طويل بالليل لحظات فرح صغيره بس كانت بتعمل جوايا سعاده كبيره وحتى الزعل اللي كان بيحصل بينا كان بيخليني افهم قد ايه انا متعلق بيكي ومقدر وجودك في حياتي 💗\n\nانا يمكن مش دايما بعرف اعبر كويس عن اللي جوايا بس الحقيقه ان وجودك في حياتي عامل فرق كبير جدا مجرد انك موجوده بتتكلمي معايا بتشاركي يومك معايا الحاجات دي بالنسبه ليا مش بسيطه خالص دي بتخليني حاسس ان في حد في الدنيا دي يخصني بجد 💗\n\nولما بشوفك قدامي بجد الاحساس ده صعب يتوصف كان كل حاجه حواليا بتسكت شويه وانا بس ببقى مركز معاكي نظره من عيونك بتعمل في قلبي حاجات كتير وضحكتك لوحدها قادره تغير يوم كامل عندي يمكن انتي متعرفيش قد ايه اللحظات الصغيره دي بتفرق معايا 💗\n\nاحنا عدينا بحاجات كتير سوا خناقات زعل وبعدنا كذا مره لكن كل مره كنا بنرجع تاني وده لان الحقيقه الواضحه بالنسبه ليا ان مفيش حد في الدنيا يقدر ياخد مكانك في قلبي ولا في حياتي انا ممكن ازعل منك ممكن نتخانق لكن عمري ما قدرت اتخيل حياتي من غيرك 💗\n\nانتي بالنسبه ليا مش مجرد حبيبتي وبس انتي حد بقى جزء من حياتي ومن روحي حد لما بفتكر مستقبلي بلاقيكي موجوده فيه تلقائي كأن اسمك مكتوب في كل حاجه جايه في حياتي 💗\n\nيمكن الكلام عمره ما هيكفي يوصف اللي جوا قلبي بس الحاجه الوحيده اللي متاكد منها ان حبي ليكي حقيقي جدا حب كبر مع الوقت ومع كل يوم بيعدي بيزيد اكتر مش بيقل 💗\n\nواتمنى بجد ان السنين اللي فاتت تبقى مجرد البدايه بدايه لسنين اكتر نعيشها سوا نكبر فيها جنب بعض ونفضل دايما لبعض زي ما احنا 💗\n\nوبصراحه انا كل يوم بدعي ربنا انه يخليكي ليا وميحرمنيش منك ابدا ويجمعني بيكي دايما على خير ويخليكي في حياتي طول العمر يا بسمله ربنا يديمك نعمه في حياتي ويفضل رابط قلوبنا ببعض دايما ومايبعدناش عن بعض ابدا 💗\n\nانا بجد شايفك اجمل هديه ربنا بعتهالي في حياتي واتمنى من قلبي ان ربنا يفضل محافظ علينا لبعض ونفضل دايما جنب بعض في كل لحظه حلوه وكل لحظه صعبه ونكمل حياتنا واحنا ماسكين في بعض كده لحد اخر العمر وربنا يعلم قد ايه انا بحبك وقد ايه انا ممتن انك في حياتي ويا رب تفضلي دايما معايا ومن نصيبي وتبقي اجمل حاجه مكتوبه في عمري كلو يا بسمله 💗\n\nكل سنه وانتي معايا يا بسبوستي...كل سنه وانتي اقرب انسانه لقلبي...وكل سنه واحنا بنكمل الحكايه اللي بدات من 3 سنين الحكايه اللي بقت اجمل حاجه حصلتلي في حياتي 💗\nوبكل\n بساطه كده انا بحبك جداً يا بسبوستي\nحب يمكن اكبر من الكلام واصدق من اي وعد حب حقيقي من قلبي ليكي انتي وبس 💗\n\nجت متأخره شويه بس معلش يا بسبوستي 😔💗`
        }
    };

    function closeOverlay() {
        document.getElementById('overlay').style.display = 'none';
        showMainMenu();
    }

    function showMainMenu() {
    clearTimeout(typingTimer); // إيقاف الكتابة لو كانت شغالة
    
    // السطر ده هو اللي هيخلي "رسائل السعادة" تظهر تاني لما ترجع
    mainTitle.style.display = "block"; 
    
    mainTitle.innerText = "💌 2 هابييي مسجججج 💌";
    mainExitBtn.style.display = "block";
    contentArea.innerHTML = `
        <button style="width: 200px;" class="button" onclick="typeMessage('msg1')">🎀 Happy Message 1 🎀</button>
        <button style="width: 200px;" class="button" onclick="typeMessage('msg2')">💋 Happy Message 2 💋</button>
    `;
}

function typeMessage(msgKey) {
    clearTimeout(typingTimer);
    const data = messages[msgKey];

    mainTitle.style.display = "none";
    mainExitBtn.style.display = "none"; 
    
    contentArea.innerHTML = `
        <h3 style="color: #ff5fa2; margin-bottom: 10px; font-size:20px;">${data.title}</h3>

        <div class="message-box">
            <div class="message-content" id="typingText"></div>
        </div>

        <button style="width: 200px;" class="button back-btn" onclick="showMainMenu()">رجوع للخلف ↩️</button>
    `;
    
    const box = document.getElementById('typingText');
    let i = 0;

    function typing() {
    if (i < data.text.length) {
        box.innerHTML += data.text.charAt(i);
        i++;
        typingTimer = setTimeout(typing, 25);
    }
}
    typing();
}
    
    function createHeart(x,y){
    let heart=document.createElement("div");
    heart.className="heart-touch";
    heart.innerHTML="💗";

    let size=Math.random()*15+15;
    heart.style.fontSize=size+"px";

    heart.style.left=(x-size/2)+"px";
    heart.style.top=(y-size/2)+"px";

    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1200);
}

// عند الضغط
document.addEventListener("click",e=>{
    createHeart(e.clientX,e.clientY);
});

// عند السكرول
document.addEventListener("scroll",()=>{
    createHeart(
        window.innerWidth/2,
        window.innerHeight/2
    );
});
    
    // منع كليك يمين
document.addEventListener("contextmenu",e=>e.preventDefault());

// منع اختصارات النسخ
document.addEventListener("keydown",e=>{
if(
(e.ctrlKey && ["c","x","u","s","a"].includes(e.key.toLowerCase())) ||
(e.ctrlKey && e.shiftKey && e.key.toLowerCase()=="i") ||
(e.key==="F12")
){
e.preventDefault();
}
});
</script>
